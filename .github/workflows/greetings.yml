name: Greetings

on:
  pull_request_target:
    types:
      - opened
  issues:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Greet First-Time Contributors
    runs-on: ubuntu-latest

    steps:
    - uses: actions/first-interaction@v3
      with:
        issue_message: |
          Thanks for opening your first issue in ``concreteproperties`` :raised_hands: Pull requests are always welcome :wink:
        pr_message: |
          Thank you for your contribution to ``concreteproperties`` :pray: We will be reviewing your PR shortly :monocle_face:
